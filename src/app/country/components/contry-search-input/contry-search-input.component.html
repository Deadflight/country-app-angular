<section class="flex flex-grow gap-2 mt-2">
  <input
    type="text"
    class="input input-bordered mr-2 w-56"
    [placeholder]="placeHolder()"
    autofocus
    #txtSearch
    (keyup.enter)="onSearchCountry(txtSearch.value)"
    (keyup)="inputValue.set(txtSearch.value)"
  />
  <button class="btn btn-primary" (click)="onSearchCountry(txtSearch.value)">
    Buscar
  </button>
</section>

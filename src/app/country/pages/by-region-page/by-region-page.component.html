<h1 class="text-2xl font-bold">Por región</h1>
<p class="text-gray-500 text-lg">
  Selecciona una región para ver los países que pertenecen a ella.
</p>

<div class="flex space-x-2 mt-10">
  @for (region of countryService.regions; track region) {
  <button
    class="btn btn-soft"
    (click)="onSearchByRegion(region)"
    [class.btn-primary]="region === selectedRegion()"
  >
    {{ region }}
  </button>
  }
</div>

<country-list
  [countries]="countryResource.value() ?? []"
  [errorMessage]="countryResource.error()"
  [isLoading]="countryResource.isLoading()"
  [isEmpty]="countryResource.value()?.length === 0"
></country-list>
